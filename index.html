document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rmal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"db4a5c76-9ab8-4446-b180-007c7773758b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"ab245904-3cad-456d-b518-e61eca700959\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"cdb9d74a-8044-4087-8b4e-ad96fc501842\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"db4a5c76-9ab8-4446-b180-007c7773758b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\/style>\n<script src=\"aaefd580-7061-4f59-b79f-f4ccfff7da9a\"><\/script>\n<style>\n  body{margin:0;background:#EFEBE2;color:#141210;font-family:'Jost',system-ui,sans-serif;font-weight:300;font-size:16.5px;line-height:1.72;-webkit-font-smoothing:antialiased}\n  a{color:#7B3B1E;text-decoration:none;border-bottom:1px solid rgba(140,94,68,.35)}\n  a:hover{color:#6E4632;border-bottom-color:#6E4632}\n  ::selection{background:#E4DBCB}\n  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n<\/style>\n<\/helmet>\n\n<div style=\"display:flex;min-height:100vh;background:#EFEBE2\">\n\n  <aside style=\"width:288px;flex:0 0 288px;background:#141210;border-right:1px solid #141210;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:44px 0 28px\">\n    <div style=\"padding:0 34px 28px\">\n      <div style=\"font-family:'Cormorant Garamond',serif;font-weight:300;font-size:38px;line-height:1;letter-spacing:.14em;color:#F7F3EC\">FWS<\/div>\n      <div style=\"height:1px;background:#4A423A;margin:16px 0 14px;width:44px\"><\/div>\n      <div style=\"font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#B9AE9E;font-weight:400\">Leilões de Imóveis<\/div>\n      <div style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:#D08A5E;margin-top:8px\">guia de estudo<\/div>\n    <\/div>\n\n    <nav style=\"display:flex;flex-direction:column;gap:2px;padding:0 18px;flex:1\">\n      <button sc-camel-on-click=\"{{ goInicio }}\" style=\"{{ navInicio }}\"><span style=\"width:22px;font-family:'IBM Plex Mono',monospace;font-size:10px;opacity:.55\">00<\/span>Início<\/button>\n      <button sc-camel-on-click=\"{{ goBasico }}\" style=\"{{ navBasico }}\"><span style=\"width:22px;font-family:'IBM Plex Mono',monospace;font-size:10px;opacity:.55\">01<\/span>Básico<\/button>\n      <button sc-camel-on-click=\"{{ goInter }}\" style=\"{{ navInter }}\"><span style=\"width:22px;font-family:'IBM Plex Mono',monospace;font-size:10px;opacity:.55\">02<\/span>Intermediário<\/button>\n      <button sc-camel-on-click=\"{{ goAvancado }}\" style=\"{{ navAvancado }}\"><span style=\"width:22px;font-family:'IBM Plex Mono',monospace;font-size:10px;opacity:.55\">03<\/span>Avançado<\/button>\n      <div style=\"height:1px;background:#3A342C;margin:14px 16px\"><\/div>\n      <button sc-camel-on-click=\"{{ goChecklists }}\" style=\"{{ navChecklists }}\"><span style=\"width:22px;font-family:'IBM Plex Mono',monospace;font-size:10px;opacity:.55\">✓<\/span>Checklists &amp; Modelos<\/button>\n      <button sc-camel-on-click=\"{{ goVideos }}\" style=\"{{ navVideos }}\"><span style=\"width:22px;font-family:'IBM Plex Mono',monospace;font-size:10px;opacity:.55\">▷<\/span>Vídeos<\/button>\n      <button sc-camel-on-click=\"{{ goLegislacao }}\" style=\"{{ navLegislacao }}\"><span style=\"width:22px;font-family:'IBM Plex Mono',monospace;font-size:10px;opacity:.55\">§<\/span>Referência jurídica<\/button>\n    <\/nav>\n\n    <div style=\"padding:22px 34px 0;margin:0 0 0;border-top:1px solid #3A342C;color:#9C9284;font-size:11.5px;line-height:1.6;letter-spacing:.02em\">\n      © 2026 Fernanda Guimarães Campos Cardoso de Oliveira. Todos os direitos reservados.\n      <div style=\"margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase\">Rev. {{ lastReview }}<\/div>\n    <\/div>\n  <\/aside>\n\n  <main style=\"flex:1;min-width:0;display:flex;justify-content:center\">\n    <div style=\"width:100%;max-width:880px;padding:76px 72px 140px\">\n\n      <section style=\"{{ secInicio }}\">\n        <div style=\"font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#7B3B1E;font-weight:400\">Portal de estudo<\/div>\n        <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:300;font-size:58px;line-height:1.08;letter-spacing:-.01em;margin:18px 0 22px;color:#141210;text-wrap:pretty\">Aprender a arrematar imóveis em leilão, com método<\/h1>\n        <p style=\"font-size:19px;color:#3B362E;max-width:56ch;margin:0 0 44px;text-wrap:pretty\">Um lugar só para organizar o estudo: conceitos, base legal, análise de risco, checklists práticos e vídeos selecionados — do nível iniciante ao avançado.<\/p>\n\n        <div style=\"{{ imgBlock }}\">\n          <div style=\"position:relative;width:100%;aspect-ratio:16/6.5;border:1px solid #E0D9CD;background:#EFEAE2\">\n            <img src=\"hero.jpg\" alt=\"Interior decorado com luz natural\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n          <\/div>\n          <\/div>\n\n        <div style=\"border-left:3px solid #7B3B1E;background:#EFE1D6;padding:20px 26px;margin:44px 0\">\n          <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:8px;font-weight:400\">Aviso importante<\/div>\n          <div style=\"color:#241F19\"><strong style=\"font-weight:500\">Este material é educativo.<\/strong> Não constitui consultoria jurídica, financeira ou de investimento. Regras de leilão mudam por edital, por tribunal e por lei; sempre confirme no edital do imóvel e, em casos concretos, consulte um advogado especialista. Trechos jurídicos redigidos aqui devem ser revisados antes de virar decisão.<\/div>\n        <\/div>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:300;font-size:34px;line-height:1.2;margin:64px 0 6px;color:#141210\">Por onde começar<\/h2>\n        <p style=\"color:#575147;margin:0 0 28px\">A trilha abaixo segue a ordem natural de aprendizado.<\/p>\n\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#C9BFAF;border:1px solid #C9BFAF\">\n          <div sc-camel-on-click=\"{{ goBasico }}\" style=\"background:#FFFDFA;padding:28px 24px 30px;cursor:pointer\" style-hover=\"background:#FFFFFF\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:#7B3B1E\">NÍVEL 01<\/div>\n            <h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:26px;margin:12px 0 8px;color:#141210\">Básico<\/h3>\n            <p style=\"font-size:14.5px;color:#575147;margin:0;line-height:1.6\">O que é leilão, os tipos, a base legal e as etapas de ponta a ponta.<\/p>\n          <\/div>\n          <div sc-camel-on-click=\"{{ goInter }}\" style=\"background:#FFFDFA;padding:28px 24px 30px;cursor:pointer\" style-hover=\"background:#FFFFFF\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:#7B3B1E\">NÍVEL 02<\/div>\n            <h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:26px;margin:12px 0 8px;color:#141210\">Intermediário<\/h3>\n            <p style=\"font-size:14.5px;color:#575147;margin:0;line-height:1.6\">Ler edital e matrícula, ordem da due diligence e cálculo do teto de lance.<\/p>\n          <\/div>\n          <div sc-camel-on-click=\"{{ goAvancado }}\" style=\"background:#FFFDFA;padding:28px 24px 30px;cursor:pointer\" style-hover=\"background:#FFFFFF\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:#7B3B1E\">NÍVEL 03<\/div>\n            <h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:26px;margin:12px 0 8px;color:#141210\">Avançado<\/h3>\n            <p style=\"font-size:14.5px;color:#575147;margin:0;line-height:1.6\">Pós-arrematação, imissão na posse, alienação fiduciária e riscos jurídicos.<\/p>\n          <\/div>\n          <div sc-camel-on-click=\"{{ goChecklists }}\" style=\"background:#FFFDFA;padding:28px 24px 30px;cursor:pointer\" style-hover=\"background:#FFFFFF\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:#6E7561\">PRÁTICA<\/div>\n            <h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:26px;margin:12px 0 8px;color:#141210\">Checklists<\/h3>\n            <p style=\"font-size:14.5px;color:#575147;margin:0;line-height:1.6\">Listas de diligência, mapa de riscos e modelos de documentos.<\/p>\n          <\/div>\n          <div sc-camel-on-click=\"{{ goVideos }}\" style=\"background:#FFFDFA;padding:28px 24px 30px;cursor:pointer\" style-hover=\"background:#FFFFFF\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:#6E7561\">MÍDIA<\/div>\n            <h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:26px;margin:12px 0 8px;color:#141210\">Vídeos<\/h3>\n            <p style=\"font-size:14.5px;color:#575147;margin:0;line-height:1.6\">Sete conteúdos selecionados dos últimos 12 meses, com ordem de estudo.<\/p>\n          <\/div>\n          <div sc-camel-on-click=\"{{ goLegislacao }}\" style=\"background:#FFFDFA;padding:28px 24px 30px;cursor:pointer\" style-hover=\"background:#FFFFFF\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:#6E7561\">CONSULTA<\/div>\n            <h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:26px;margin:12px 0 8px;color:#141210\">Referência jurídica<\/h3>\n            <p style=\"font-size:14.5px;color:#575147;margin:0;line-height:1.6\">Leis, artigos do CPC e teses do STJ que sustentam tudo.<\/p>\n          <\/div>\n        <\/div>\n\n        <div style=\"margin:56px 0 0;padding:34px 0 0;border-top:1px solid #DFD8CC\">\n          <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#6E7561;margin-bottom:14px\">A ideia-chave que atravessa todo o material<\/div>\n          <p style=\"font-family:'Cormorant Garamond',serif;font-size:25px;line-height:1.45;color:#1E1B17;margin:0;max-width:60ch;text-wrap:pretty\">Leilão de imóveis não é comprar “pela metade do preço” de forma passiva. É uma <em>atividade empresarial<\/em> de aquisição, solução de problemas, regularização, reforma e revenda. A vantagem competitiva não está em achar o anúncio — está em avaliar melhor que os concorrentes o risco jurídico, o custo integral, a liquidez e o prazo da operação.<\/p>\n        <\/div>\n      <\/section>\n\n      <section style=\"{{ secBasico }}\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;color:#7B3B1E\">01 — BÁSICO<\/div>\n        <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:300;font-size:50px;line-height:1.1;margin:14px 0 18px;color:#141210\">Fundamentos do leilão de imóveis<\/h1>\n        <p style=\"font-size:18px;color:#3B362E;max-width:58ch;margin:0 0 40px\">O objetivo aqui é entender o que é um leilão, quais tipos existem, quem regula e como o processo caminha do começo ao fim.<\/p>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">01<\/span>O que é um leilão de imóveis<\/h2>\n        <p style=\"margin:0 0 14px;color:#1E1B17\">Leilão é a venda pública de um imóvel a quem oferecer o maior lance, dentro de regras definidas em um <strong style=\"font-weight:500\">edital<\/strong>. O imóvel costuma ir a leilão porque serve para pagar uma dívida — de um processo judicial, de um financiamento não pago, ou de um ente público que quer se desfazer do bem. Por isso os preços podem ficar abaixo do mercado: a venda é, muitas vezes, forçada e com prazo.<\/p>\n        <p style=\"margin:0;color:#1E1B17\">O desconto, porém, é a compensação pelo trabalho e pelo risco: analisar documentos, lidar com ocupação, pagar custos e esperar a posse. Comprar em leilão é assumir esse pacote inteiro.<\/p>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 20px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">02<\/span>Os quatro tipos de leilão<\/h2>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#C9BFAF;border:1px solid #C9BFAF\">\n          <div style=\"background:#FFFDFA;padding:26px\">\n            <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:10px\">Judicial<\/div>\n            <p style=\"margin:0;font-size:15px;line-height:1.65;color:#241F19\">Determinado por um juiz dentro de um processo (execução cível, fiscal, trabalhista, falência, inventário). Conduzido por leiloeiro público. Tem <strong style=\"font-weight:500\">garantias processuais<\/strong>, mas exige rigor na análise de ônus e ocupação. Costuma ter descontos maiores — e mais complexidade jurídica.<\/p>\n          <\/div>\n          <div style=\"background:#FFFDFA;padding:26px\">\n            <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:10px\">Extrajudicial<\/div>\n            <p style=\"margin:0;font-size:15px;line-height:1.65;color:#241F19\">Fora do Judiciário, típico de financiamento com <strong style=\"font-weight:500\">alienação fiduciária<\/strong> (Lei 9.514/97). O banco consolida a propriedade e leva o imóvel a leilão. Rito mais rápido e padronizado — os imóveis da Caixa são o exemplo mais comum.<\/p>\n          <\/div>\n          <div style=\"background:#FFFDFA;padding:26px\">\n            <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:10px\">Público / Estatal<\/div>\n            <p style=\"margin:0;font-size:15px;line-height:1.65;color:#241F19\">Promovido por União, estados ou municípios para vender bens (Lei 14.133/2021). Ampla publicidade e, muitas vezes, possibilidade de parcelamento pelo próprio órgão.<\/p>\n          <\/div>\n          <div style=\"background:#FFFDFA;padding:26px\">\n            <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:10px\">Particular / Voluntário<\/div>\n            <p style=\"margin:0;font-size:15px;line-height:1.65;color:#241F19\">Organizado pelo próprio proprietário ou empresa, por regras contratuais próprias. Mais flexível, mas depende totalmente da idoneidade do leiloeiro — exige diligência redobrada.<\/p>\n          <\/div>\n        <\/div>\n\n        <h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:23px;margin:40px 0 4px;color:#1E1B17\">Tabela comparativa<\/h3>\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;margin:16px 0;font-size:14.5px\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align:left;padding:10px 14px 10px 0;border-bottom:1px solid #141210;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#141210\">Modalidade<\/sc-raw-th>\n            <sc-raw-th style=\"text-align:left;padding:10px 14px;border-bottom:1px solid #141210;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#141210\">Regulamentação<\/sc-raw-th>\n            <sc-raw-th style=\"text-align:left;padding:10px 14px;border-bottom:1px solid #141210;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#141210\">Quem promove<\/sc-raw-th>\n            <sc-raw-th style=\"text-align:left;padding:10px 0 10px 14px;border-bottom:1px solid #141210;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#141210\">Ponto de atenção<\/sc-raw-th>\n          <\/sc-raw-tr><\/sc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:14px 14px 14px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#141210;font-weight:400\">Judicial<\/sc-raw-td>\n              <sc-raw-td style=\"padding:14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">CPC/2015 (arts. 879–903); CNJ 236/2016<\/sc-raw-td>\n              <sc-raw-td style=\"padding:14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Judiciário + leiloeiro público<\/sc-raw-td>\n              <sc-raw-td style=\"padding:14px 0 14px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Análise de ônus prévia é imprescindível; caução e pagamento em prazo curto.<\/sc-raw-td>\n            <\/sc-raw-tr>\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:14px 14px 14px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#141210;font-weight:400\">Extrajudicial<\/sc-raw-td>\n              <sc-raw-td style=\"padding:14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Lei 9.514/97 (arts. 26–27-A); Lei 14.711/2023<\/sc-raw-td>\n              <sc-raw-td style=\"padding:14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Credor fiduciário (banco)<\/sc-raw-td>\n              <sc-raw-td style=\"padding:14px 0 14px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Sequência de dois leilões; devedor tem preferência de recompra.<\/sc-raw-td>\n            <\/sc-raw-tr>\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:14px 14px 14px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#141210;font-weight:400\">Público<\/sc-raw-td>\n              <sc-raw-td style=\"padding:14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Lei 14.133/2021<\/sc-raw-td>\n              <sc-raw-td style=\"padding:14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Órgãos públicos<\/sc-raw-td>\n              <sc-raw-td style=\"padding:14px 0 14px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Regras de licitação; às vezes parcelamento.<\/sc-raw-td>\n            <\/sc-raw-tr>\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:14px 14px 14px 0;vertical-align:top;color:#141210;font-weight:400\">Particular<\/sc-raw-td>\n              <sc-raw-td style=\"padding:14px;vertical-align:top;color:#3B362E\">Contratual (Código Civil)<\/sc-raw-td>\n              <sc-raw-td style=\"padding:14px;vertical-align:top;color:#3B362E\">Proprietário<\/sc-raw-td>\n              <sc-raw-td style=\"padding:14px 0 14px 14px;vertical-align:top;color:#3B362E\">Garantias dependem da formalidade do contrato e do leiloeiro.<\/sc-raw-td>\n            <\/sc-raw-tr>\n          <\/sc-raw-tbody>\n        <\/sc-raw-table>\n        <p style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:#575147;margin:6px 0 0\">A modalidade eletrônica (pela internet) pode se aplicar a qualquer um dos tipos acima: exige cadastro prévio na plataforma e atenção ao tutorial do leilão.<\/p>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">03<\/span>As modalidades da Caixa não são todas iguais<\/h2>\n        <p style=\"margin:0 0 8px;color:#1E1B17\">Como os imóveis da Caixa são a porta de entrada mais comum, vale conhecer o caminho que um imóvel percorre — porque o preço de partida e as regras de comissão mudam a cada etapa:<\/p>\n        <ul style=\"list-style:none;padding:0;margin:18px 0\">\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">1ª praça (leilão SFI):<\/strong> o preço de partida é o <strong style=\"font-weight:500\">valor de avaliação<\/strong>. Como ninguém compra em leilão pagando o preço cheio, quase nunca há arremate aqui. Comissão de 5%.<\/span><\/li><li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">2ª praça (leilão SFI):<\/strong> o preço passa a ser o <strong style=\"font-weight:500\">valor da dívida<\/strong> — e é por isso que a 2ª praça pode custar <em>mais<\/em> que a 1ª, e até mais que o imóvel vale. O saldo devedor acumula prestações vencidas, encargos e o custo de retomada. Comissão de 5%.<\/span><\/li><li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Leilão / licitação aberta:<\/strong> disputa no site do leiloeiro; comissão de 5% paga pelo comprador.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Venda on-line:<\/strong> propostas até o encerramento do cronômetro; vence a maior. Negociação direta no portal.<\/span><\/li>\n          <li style=\"padding:12px 0;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Compra direta:<\/strong> última etapa do funil, sem prazo e sem disputa — a primeira proposta válida pelo valor mínimo vence. Sem leiloeiro, portanto sem os 5%.<\/span><\/li>\n        <\/ul>\n        <div style=\"border-left:3px solid #7B3B1E;background:#EFE1D6;padding:20px 26px;margin:28px 0\">\n          <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:8px\">Cuidado com uma “regra” falsa<\/div>\n          <div style=\"color:#241F19\"><strong style=\"font-weight:500\">Não<\/strong> se deve somar automaticamente 5% de comissão a toda venda da Caixa: nas modalidades de venda on-line e compra direta não há leiloeiro. E a “regra dos 10%” sobre débitos de condomínio é <strong style=\"font-weight:500\">cláusula do anúncio específico<\/strong>, não regra universal. Sempre confirme na página do imóvel e no edital.<\/div>\n        <\/div>\n\n        <div style=\"border-left:3px solid #4F5741;background:#E5E8DB;padding:20px 26px;margin:28px 0\"><div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#5C6350;margin-bottom:8px\">Imóvel que sobrou não é imóvel ruim<\/div><div style=\"color:#241F19\">Essa é a leitura que mais muda a forma de olhar a lista. Um imóvel chega às etapas finais porque foi ofertado antes por um preço impossível — a avaliação cheia, na 1ª praça, e o valor da dívida, na 2ª. <strong style=\"font-weight:500\">O defeito estava no preço de partida, não necessariamente no imóvel.<\/strong> É justamente nas etapas seguintes que aparecem os descontos reais, e sem os 5% de comissão.<\/div><\/div>\n\n        <div style=\"border-left:3px solid #7B3B1E;background:#EFE1D6;padding:20px 26px;margin:28px 0\"><div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:8px\">A condição de pagamento não é fixa<\/div><div style=\"color:#241F19\">Um detalhe pouco conhecido e de efeito prático grande: <strong style=\"font-weight:500\">o mesmo imóvel pode não aceitar financiamento hoje e passar a aceitar em alguns dias<\/strong>. A forma de pagamento é decisão comercial do vendedor, e ela muda enquanto o imóvel está encalhado — assim como o preço. Por isso vale manter uma lista própria dos candidatos, com o link de cada um, e reconferir periodicamente em vez de descartar de vez.<div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;color:#A79E92;margin-top:12px\">A base da Caixa é atualizada cerca de 2× ao dia; lotes novos costumam entrar no começo da semana.<\/div><\/div><\/div>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">04<\/span>Quem regula: o panorama legal<\/h2>\n        <ul style=\"list-style:none;padding:0;margin:18px 0\">\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">CPC/2015, arts. 879–903<\/strong> — o coração do leilão judicial: procedimento, lances, preço vil, prazos, carta de arrematação.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Lei 9.514/1997<\/strong> (com Lei 13.465/2017 e 14.711/2023) — alienação fiduciária e leilão extrajudicial.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Resolução CNJ 236/2016<\/strong> — uniformiza o leilão judicial eletrônico; exige leiloeiro credenciado e prevê comissão mínima de 5% a cargo do arrematante.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Lei 14.133/2021<\/strong> — leilão como modalidade de licitação (bens públicos).<\/span><\/li>\n          <li style=\"padding:12px 0;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Decreto 21.981/1932<\/strong> — regulamenta a profissão de leiloeiro.<\/span><\/li>\n        <\/ul>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">05<\/span>As etapas, de ponta a ponta<\/h2>\n        <div style=\"display:grid;grid-template-columns:auto 1fr;gap:0 22px;margin:24px 0\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">01<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Publicação do edital<\/div><div style=\"font-size:15px;color:#575147\">No mínimo 5 dias antes (20 dias se o imóvel valer mais de 60 salários mínimos).<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">02<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Diligência prévia<\/div><div style=\"font-size:15px;color:#575147\">Ler o edital, obter matrícula atualizada e certidões, visitar o imóvel e montar a planilha de custos.<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">03<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Primeiro leilão (hasta 1)<\/div><div style=\"font-size:15px;color:#575147\">Lance mínimo = valor de avaliação.<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">04<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Segundo leilão (se necessário)<\/div><div style=\"font-size:15px;color:#575147\">Aceita lance menor, mas nunca “vil” — no judicial, ≥ 50% da avaliação (CPC 891).<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">05<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Arrematação + caução<\/div><div style=\"font-size:15px;color:#575147\">Assinatura do auto e depósito da caução (em regra 5%) em prazo curto.<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">06<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Homologação e carta de arrematação<\/div><div style=\"font-size:15px;color:#575147\">Passado o prazo recursal, o juiz expede o título de transferência.<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">07<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Registro no cartório de imóveis<\/div><div style=\"font-size:15px;color:#575147\">A propriedade se transfere formalmente; pagam-se emolumentos e ITBI se devido.<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">08<\/div>\n          <div><div style=\"font-weight:400;color:#141210\">Imissão na posse<\/div><div style=\"font-size:15px;color:#575147\">Se o imóvel estiver ocupado, requerer judicialmente a entrega da posse.<\/div><\/div>\n        <\/div>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">06<\/span>Glossário essencial<\/h2>\n        <ul style=\"list-style:none;padding:0;margin:18px 0\">\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Edital:<\/strong> documento que define todas as regras daquele leilão. É a lei do caso.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Matrícula:<\/strong> a “certidão de nascimento” do imóvel no cartório — mostra dono, penhoras, hipotecas.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Caução:<\/strong> depósito de garantia (em regra 5%) que o arrematante faz logo após vencer.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Preço vil:<\/strong> lance baixo demais, que a lei não aceita (abaixo de 50% da avaliação, no judicial).<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Carta de arrematação:<\/strong> título que comprova a aquisição, usado para registrar o imóvel.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Imissão na posse:<\/strong> ato pelo qual o arrematante toma a posse física do imóvel.<\/span><\/li>\n          <li style=\"padding:12px 0;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Alienação fiduciária:<\/strong> garantia em que o imóvel fica em nome do banco até a quitação do financiamento.<\/span><\/li>\n        <\/ul>\n      <\/section>\n\n      <section style=\"{{ secInter }}\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;color:#7B3B1E\">02 — INTERMEDIÁRIO<\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#8A8177;border:1px solid #DFD8CC;padding:3px 8px\">RASCUNHO · REVISAR<\/div>\n        <\/div>\n        <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:300;font-size:50px;line-height:1.1;margin:14px 0 18px;color:#141210\">Análise, diligência e cálculo do lance<\/h1>\n        <p style=\"font-size:18px;color:#3B362E;max-width:58ch;margin:0 0 40px\">Aqui sai a teoria e entra o método: como avaliar se um imóvel vale a pena antes de dar qualquer lance.<\/p>\n\n        <div style=\"{{ imgBlock }}\">\n          <div style=\"position:relative;width:100%;aspect-ratio:16/6;border:1px solid #E0D9CD;background:#EFEAE2\">\n            <img src=\"diligencia.jpg\" alt=\"Condominio residencial de luxo\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block\">\n          <\/div>\n        <\/div>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">01<\/span>Comece pelo mercado, não pela matrícula<\/h2>\n        <p style=\"margin:0;color:#1E1B17\">O erro clássico do iniciante é mergulhar na análise jurídica de um imóvel que nem tem margem. A sequência eficiente é o contrário:<\/p>\n        <div style=\"display:grid;grid-template-columns:auto 1fr;gap:0 22px;margin:24px 0\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">01<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Estimar o valor real de venda rápida<\/div><div style=\"font-size:15px;color:#575147\">Quanto o imóvel vende de fato, em prazo razoável — não o anúncio mais caro nem a avaliação do banco.<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">02<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Verificar a liquidez<\/div><div style=\"font-size:15px;color:#575147\">A rua, o prédio e a região têm procura? Imóvel ilíquido prende capital por anos.<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">03<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Definir o desconto mínimo necessário<\/div><div style=\"font-size:15px;color:#575147\">Qual abatimento paga o risco, os custos e o tempo do dinheiro parado.<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">04<\/div>\n          <div><div style=\"font-weight:400;color:#141210\">Só então fazer a diligência documental completa<\/div><div style=\"font-size:15px;color:#575147\">Evita gastar dias analisando algo que já sabíamos ser inviável.<\/div><\/div>\n        <\/div>\n        <div style=\"border-left:3px solid #4F5741;background:#E5E8DB;padding:20px 26px;margin:28px 0\">\n          <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#5C6350;margin-bottom:8px\">Que valor usar<\/div>\n          <div style=\"color:#241F19\">O parâmetro correto é o <strong style=\"font-weight:500\">valor provável de venda<\/strong> em prazo razoável — não a avaliação do banco, não o maior anúncio, não a opinião isolada de um corretor.<\/div>\n        <\/div>\n\n        <p style=\"margin:26px 0 0;color:#1E1B17\">Na prática, o levantamento é mais simples do que parece. Copie o endereço exato da ficha do imóvel e procure anúncios <strong style=\"font-weight:500\">no mesmo condomínio ou na mesma rua<\/strong>, com metragem parecida, nos portais de classificados. Três pontos fazem diferença no resultado:<\/p>\n        <div style=\"display:grid;grid-template-columns:auto 1fr;gap:0 22px;margin:24px 0\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">01<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Adote o comparável mais barato, não a média<\/div><div style=\"font-size:15px;color:#575147\">Anúncio é preço pedido, não preço fechado — e costuma fechar abaixo. Puxar a referência para o topo da faixa é a forma mais comum de uma conta honesta produzir um resultado enganoso.<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">02<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Descarte os anúncios de repasse<\/div><div style=\"font-size:15px;color:#575147\">Valores “quebrados” com selo de leilão são de quem está revendendo arremate ainda em andamento. Servem como sinal de que existe um mercado ali — não como referência de preço.<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">03<\/div>\n          <div><div style=\"font-weight:400;color:#141210\">Ligue para uma imobiliária da região<\/div><div style=\"font-size:15px;color:#575147\">Confirma o preço real de fechamento e já cria o contato que depois guarda a chave, indica o pintor e anuncia o imóvel. É o que torna viável arrematar em outra cidade.<\/div><\/div>\n        <\/div>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">02<\/span>Ler o edital e a matrícula<\/h2>\n        <p style=\"margin:0;color:#1E1B17\">O edital define prazos, condições de pagamento, valor mínimo, comissão, caução e quais débitos ficam a cargo do arrematante. A matrícula atualizada revela penhoras, hipotecas, usufrutos e averbações. Os dois juntos são <strong style=\"font-weight:500\">indispensáveis — mas insuficientes isoladamente<\/strong>: por isso a análise segue para o processo e as certidões.<\/p>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 20px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">03<\/span>A ordem correta da due diligence<\/h2>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#C9BFAF;border:1px solid #C9BFAF\">\n          <div style=\"background:#FFFDFA;padding:24px 22px\">\n            <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#9C4B3B;margin-bottom:14px\">Risco crítico<\/div>\n            <div style=\"display:flex;flex-direction:column;gap:9px;font-size:14.5px;color:#241F19\">\n              <div>Edital e página do imóvel<\/div><div>Matrícula atualizada<\/div><div>Processo / cadeia da execução<\/div><div>Natureza dos gravames<\/div><div>Usufruto, locação, fração ideal, direitos de terceiros<\/div><div>Situação da ocupação<\/div>\n            <\/div>\n          <\/div>\n          <div style=\"background:#FFFDFA;padding:24px 22px\">\n            <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:14px\">Risco financeiro<\/div>\n            <div style=\"display:flex;flex-direction:column;gap:9px;font-size:14.5px;color:#241F19\">\n              <div>Condomínio e IPTU<\/div><div>Estado físico e reforma<\/div><div>Financiamento realmente disponível<\/div><div>Custos cartorários e tributários<\/div><div>Prazo até posse e revenda<\/div><div>Liquidez da região<\/div>\n            <\/div>\n          <\/div>\n          <div style=\"background:#FFFDFA;padding:24px 22px\">\n            <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#5C6350;margin-bottom:14px\">Risco estratégico<\/div>\n            <div style=\"display:flex;flex-direction:column;gap:9px;font-size:14.5px;color:#241F19\">\n              <div>Comprador ou locatário provável<\/div><div>Facilidade de administrar à distância<\/div><div>Risco de invasão ou deterioração<\/div><div>Plano B se a venda demorar<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">04<\/span>O verdadeiro cálculo do lucro<\/h2>\n        <p style=\"margin:0 0 14px;color:#1E1B17\">O lucro <strong style=\"font-weight:500\">não<\/strong> é “desconto sobre a avaliação”. É a diferença entre o valor conservador de revenda e o <strong style=\"font-weight:500\">custo total<\/strong> da operação, que inclui:<\/p>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:0 40px\">\n          <div style=\"display:flex;flex-direction:column\">\n            <div style=\"padding:11px 0;border-bottom:1px solid #C9BFAF;color:#1E1B17\">Lance / preço de aquisição<\/div>\n            <div style=\"padding:11px 0;border-bottom:1px solid #C9BFAF;color:#1E1B17\">Comissão do leiloeiro (~5%)<\/div>\n            <div style=\"padding:11px 0;border-bottom:1px solid #C9BFAF;color:#1E1B17\">ITBI e registro<\/div>\n            <div style=\"padding:11px 0;border-bottom:1px solid #C9BFAF;color:#1E1B17\">Condomínio e tributos assumidos<\/div>\n            <div style=\"padding:11px 0;border-bottom:1px solid #C9BFAF;color:#1E1B17\">Advogado e desocupação<\/div>\n            <div style=\"padding:11px 0;color:#1E1B17\">Reforma<\/div>\n          <\/div>\n          <div style=\"display:flex;flex-direction:column\">\n            <div style=\"padding:11px 0;border-bottom:1px solid #C9BFAF;color:#1E1B17\">Juros do financiamento<\/div>\n            <div style=\"padding:11px 0;border-bottom:1px solid #C9BFAF;color:#1E1B17\">Despesas durante a imobilização<\/div>\n            <div style=\"padding:11px 0;border-bottom:1px solid #C9BFAF;color:#1E1B17\">Corretagem na venda<\/div>\n            <div style=\"padding:11px 0;border-bottom:1px solid #C9BFAF;color:#1E1B17\">Imposto sobre ganho de capital<\/div>\n            <div style=\"padding:11px 0;border-bottom:1px solid #C9BFAF;color:#1E1B17\">Margem para imprevistos<\/div>\n            <div style=\"padding:11px 0;color:#1E1B17\">Custo de oportunidade do capital<\/div>\n          <\/div>\n        <\/div>\n        <div style=\"border-left:3px solid #7B3B1E;background:#EFE1D6;padding:20px 26px;margin:28px 0\">\n          <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:8px\">A regra de ouro<\/div>\n          <div style=\"color:#241F19\"><strong style=\"font-weight:500\">Nunca dê lance sem um teto calculado antes.<\/strong> “50% de desconto” pode ser um péssimo negócio se a avaliação estiver inflada, a liquidez for baixa ou os custos ocultos forem altos.<\/div>\n        <\/div>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">05<\/span>Um exemplo fechado, com números reais<\/h2>\n        <p style=\"margin:0 0 6px;color:#1E1B17\">Vale acompanhar uma conta inteira, porque é nela que os conceitos acima param de ser abstratos. O caso: um apartamento de 43 m² num condomínio popular do interior do Rio, em <strong style=\"font-weight:500\">compra direta<\/strong> — portanto sem disputa e sem comissão de leiloeiro.<\/p>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#C9BFAF;border:1px solid #C9BFAF;margin:24px 0\">\n          <div style=\"background:#FFFDFA;padding:20px 22px\"><div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#A79E92;margin-bottom:8px\">Avaliação do banco<\/div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:21px;color:#141210\">R$ 195.000<\/div><\/div>\n          <div style=\"background:#FFFDFA;padding:20px 22px\"><div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#A79E92;margin-bottom:8px\">Preço de compra<\/div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:21px;color:#141210\">R$ 117.860<\/div><\/div>\n          <div style=\"background:#FFFDFA;padding:20px 22px\"><div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#A79E92;margin-bottom:8px\">Venda conservadora<\/div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:21px;color:#141210\">R$ 215.000<\/div><\/div>\n        <\/div>\n        <p style=\"margin:0 0 4px;color:#1E1B17\">Sobre o preço de compra incidem ITBI de 2%, registro de R$ 3.000 e R$ 7.000 de reforma — o apartamento vem sem piso na sala e nos quartos. Some oito meses de condomínio e IPTU a R$ 350 por mês, e 5% de corretagem na venda. O financiamento é de 95% do valor, a 11% ao ano, quitado no ato da revenda.<\/p>\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;margin:20px 0;font-size:14.5px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;padding:10px 14px;border-bottom:1px solid #141210;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#141210\"><\/sc-raw-th><sc-raw-th style=\"text-align:right;padding:10px 14px;border-bottom:1px solid #141210;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#141210\">À vista<\/sc-raw-th><sc-raw-th style=\"text-align:right;padding:10px 14px;border-bottom:1px solid #141210;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#141210\">Financiado (5% de entrada)<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:left;color:#141210\"><strong style=\"font-weight:500\">Desembolso do próprio bolso<\/strong><\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#141210\">R$ 133.017<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#141210\">R$ 29.231<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:left;color:#141210\">Lucro bruto na venda<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#3B362E\">R$ 71.233<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#3B362E\">R$ 63.420<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:left;color:#141210\">Imposto sobre o ganho (15%)<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#3B362E\">− R$ 11.105<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#3B362E\">− R$ 11.105<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:left;color:#141210\"><strong style=\"font-weight:500\">Lucro depois do imposto<\/strong><\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#141210\">R$ 60.128<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#141210\">R$ 52.315<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:left;color:#141210\"><strong style=\"font-weight:500\">Retorno sobre o capital em 8 meses<\/strong><\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#141210\">45%<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#141210\">179%<\/sc-raw-td><\/sc-raw-tr><\/sc-raw-tbody><\/sc-raw-table>\n        <p style=\"margin:0;color:#1E1B17\">Repare no que a comparação revela: <strong style=\"font-weight:500\">no financiado o lucro em reais é menor<\/strong> — você pagou juros —, <strong style=\"font-weight:500\">mas o retorno dispara<\/strong>, porque imobilizou R$ 29 mil em vez de R$ 133 mil. É a alavancagem trabalhando. E o contraponto que quase nunca se diz: com os mesmos R$ 133 mil você faria quatro operações financiadas em vez de uma à vista.<\/p>\n        <div style=\"border-left:3px solid #4F5741;background:#E5E8DB;padding:20px 26px;margin:28px 0\"><div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#5C6350;margin-bottom:8px\">Duas linhas que costumam sumir da conta<\/div><div style=\"color:#241F19\">O <strong style=\"font-weight:500\">imposto<\/strong> e o <strong style=\"font-weight:500\">custo de oportunidade<\/strong>. Sem o imposto, o retorno financiado deste caso apareceria como 217% — e não como os 179% reais. E o capital parado renderia sozinho: com o CDI em torno de 14% ao ano, os R$ 133 mil da compra à vista renderiam cerca de R$ 9.800 líquidos nos mesmos oito meses. O ganho verdadeiro é o que sobra <em>acima<\/em> disso.<\/div><\/div>\n\n        <p style=\"margin:26px 0 0;color:#1E1B17\">Por fim, a pergunta que decide se o negócio é bom ou apenas parece bom: <strong style=\"font-weight:500\">e se a venda não sair pelo preço esperado?<\/strong><\/p>\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;margin:20px 0;font-size:14.5px\"><sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;padding:10px 14px;border-bottom:1px solid #141210;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#141210\">Se o imóvel vender por…<\/sc-raw-th><sc-raw-th style=\"text-align:right;padding:10px 14px;border-bottom:1px solid #141210;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#141210\">Retorno à vista<\/sc-raw-th><sc-raw-th style=\"text-align:right;padding:10px 14px;border-bottom:1px solid #141210;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#141210\">Retorno financiado<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:left;color:#141210\">R$ 195.000 — a própria avaliação do banco<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#3B362E\">39%<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#3B362E\">152%<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:left;color:#141210\">R$ 205.000<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#3B362E\">46%<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#3B362E\">184%<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:left;color:#141210\"><strong style=\"font-weight:500\">R$ 215.000 — cenário adotado<\/strong><\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#141210\">54%<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#141210\">217%<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:left;color:#141210\">R$ 235.000 — o anúncio mais caro da região<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#3B362E\">68%<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;text-align:right;color:#3B362E\">282%<\/sc-raw-td><\/sc-raw-tr><\/sc-raw-tbody><\/sc-raw-table>\n        <p style=\"margin:0;color:#1E1B17\">Aqui está a real demonstração de solidez. Mesmo vendendo pelo pior preço plausível — a própria avaliação do banco, R$ 20 mil abaixo do anúncio mais barato da região — a operação continua largamente viável. <strong style=\"font-weight:500\">Um bom negócio é o que sobrevive ao cenário ruim<\/strong>, não o que brilha no cenário otimista.<\/p>\n        <div style=\"border-left:3px solid #7B3B1E;background:#EFE1D6;padding:20px 26px;margin:28px 0\">\n          <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:8px\">Faça essa conta sozinha<\/div>\n          <div style=\"color:#241F19\">Todos os números acima saem da <a href=\"calculadora.html\" style=\"color:#7B3B1E;font-weight:500\">Calculadora de Viabilidade<\/a> deste site, que já traz imposto, custo de oportunidade, PRICE e SAC, retorno anualizado e o teto de lance. Troque os valores pelos do imóvel que você está olhando e o veredito se refaz sozinho.<\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;color:#A79E92;margin-top:12px\">Caso observado em jul/2026 · cálculo reproduzido de forma independente, com juros por taxa equivalente mensal<\/div>\n        <\/div>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">06<\/span>Como definir o teto de lance<\/h2>\n        <p style=\"margin:0;color:#1E1B17\">Um caminho simples: parta do valor provável de venda, subtraia todos os custos da lista acima e a margem de lucro desejada. O que sobra é o <strong style=\"font-weight:500\">máximo<\/strong> que você pode pagar. Some ainda a caução e a comissão para saber o desembolso real. Leve esse número anotado e não o ultrapasse no calor do leilão.<\/p>\n        <p style=\"margin:18px 0 0;color:#1E1B17\">Falta decidir qual margem justifica o trabalho. Quem opera com frequência costuma trabalhar com dois pisos diferentes, e a diferença entre eles não é arbitrária:<\/p>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#C9BFAF;border:1px solid #C9BFAF;margin:22px 0\">\n          <div style=\"background:#FFFDFA;padding:22px\"><div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:10px\">Operação à vista<\/div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:26px;color:#141210;margin-bottom:6px\">≥ 30%<\/div><div style=\"font-size:14.5px;color:#575147\">de lucro entre o arremate e a venda. Você imobiliza muito capital, então o retorno percentual é naturalmente menor.<\/div><\/div>\n          <div style=\"background:#FFFDFA;padding:22px\"><div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:10px\">Operação financiada<\/div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:26px;color:#141210;margin-bottom:6px\">≥ 80%<\/div><div style=\"font-size:14.5px;color:#575147\">sobre o capital desembolsado. Como se imobiliza pouco, exigir menos que isso não compensa o risco assumido.<\/div><\/div>\n        <\/div>\n        <p style=\"margin:0;color:#1E1B17\">Abaixo do piso, a decisão certa é abandonar e ir para o próximo — existem dezenas de milhares de imóveis, e o custo de deixar um passar é zero. <strong style=\"font-weight:500\">Um cuidado ao comparar imóveis entre si:<\/strong> converta sempre o retorno para base anual. Ganhar 50% em oito meses e 50% em dois anos são negócios completamente diferentes, e só a anualização mostra isso.<\/p>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">07<\/span>Financiamento: aumenta o retorno e o risco<\/h2>\n        <p style=\"margin:0 0 10px;color:#1E1B17\">Comprar financiado permite usar menos capital próprio e elevar o retorno percentual — <strong style=\"font-weight:500\">desde que o retorno do imóvel supere o custo total do financiamento<\/strong>. Os riscos frequentemente subestimados: demora na aprovação, imóvel não elegível, avaliação bancária abaixo do preço, entrada maior que a anunciada, juros durante a reforma e prestações enquanto o imóvel não gera renda.<\/p>\n        <p style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:#575147;margin:6px 0 0\">A Caixa informa que muitos — não todos — os imóveis permitem financiamento, e o uso do FGTS depende do imóvel, do comprador e das regras aplicáveis. A entrada de 5% é real nos imóveis de leilão que aceitam financiamento — bem abaixo dos cerca de 20% do mercado tradicional — mas <strong style=\"font-weight:500\">é condição do anúncio específico, não regra geral<\/strong>: confirme sempre na página do imóvel.<\/p>\n        <p style=\"margin:14px 0 0;color:#1E1B17\">Sobre a taxa: em julho de 2026 o financiamento imobiliário da Caixa parte de cerca de <strong style=\"font-weight:500\">11,2% ao ano mais TR<\/strong> no balcão, caindo para perto de <strong style=\"font-weight:500\">10,3% mais TR<\/strong> para quem tem relacionamento com o banco. Vale lembrar que a parcela real embute ainda os seguros obrigatórios e a taxa de administração — numa operação curta o efeito é pequeno, mas não é zero. E como a quitação é feita pelo saldo devedor no momento da revenda, o custo efetivo dos juros de uma operação de seis a oito meses é bem menor do que a taxa anual sugere.<\/p>\n      <\/section>\n\n      <section style=\"{{ secAvancado }}\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;color:#7B3B1E\">03 — AVANÇADO<\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#8A8177;border:1px solid #DFD8CC;padding:3px 8px\">RASCUNHO · REVISAR<\/div>\n        <\/div>\n        <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:300;font-size:50px;line-height:1.1;margin:14px 0 18px;color:#141210\">Pós-arrematação, posse e temas jurídicos<\/h1>\n        <p style=\"font-size:18px;color:#3B362E;max-width:58ch;margin:0 0 40px\">O que acontece depois de vencer o lance — e os pontos jurídicos que separam o profissional do amador.<\/p>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:36px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">01<\/span>Do lance ao registro<\/h2>\n        <div style=\"display:grid;grid-template-columns:auto 1fr;gap:0 22px;margin:24px 0\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">01<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Depósito do preço<\/div><div style=\"font-size:15px;color:#575147\">Caução imediata e o restante no prazo do edital (no judicial, tipicamente 5% em 24h e o saldo em poucos dias). Não pagar faz perder a caução e pode gerar proibição de leiloar por até 5 anos (CPC 892).<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">02<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Homologação<\/div><div style=\"font-size:15px;color:#575147\">O juiz confirma que as formalidades foram cumpridas.<\/div><\/div>
