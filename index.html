\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">03<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Carta de arrematação<\/div><div style=\"font-size:15px;color:#575147\">Título aquisitivo, expedido após o prazo recursal. Registrá-lo no cartório extingue gravames anteriores e consolida a propriedade.<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">04<\/div>\n          <div><div style=\"font-weight:400;color:#141210\">Imissão na posse<\/div><div style=\"font-size:15px;color:#575147\">Se ocupado, o juiz fixa prazo de desocupação voluntária; persistindo, pode ordenar remoção forçada.<\/div><\/div>\n        <\/div>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">02<\/span>Imóvel ocupado: risco administrável, não “mito”<\/h2>\n        <p style=\"margin:0;color:#1E1B17\">Muitos vídeos tentam desfazer o medo de imóveis ocupados — e há fundamento parcial: parte dos casos se resolve por acordo ou auxílio-mudança. Mas dizer que “ocupação não é problema” é incorreto. O certo:<\/p>\n        <ul style=\"list-style:none;padding:0;margin:18px 0\">\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span>Ocupação é um risco <strong style=\"font-weight:500\">administrável<\/strong>, mas o custo e o prazo variam muito.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span>O ocupante pode ser o antigo dono, locatário, familiar, terceiro ou invasor — e a solução jurídica muda conforme o tipo de leilão.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span>A negociação deve ocorrer <strong style=\"font-weight:500\">sem ameaça, coação ou invasão de privacidade<\/strong>.<\/span><\/li>\n          <li style=\"padding:12px 0;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span>Só compre ocupado quando o desconto remunerar a incerteza do prazo, honorários, deterioração, condomínio/tributos da espera e eventual acordo.<\/span><\/li>\n        <\/ul>\n\n        <p style=\"margin:26px 0 0;color:#1E1B17\">Como a ocupação muda a conta inteira, descobri-la <strong style=\"font-weight:500\">antes<\/strong> do lance é das diligências que mais pagam o esforço. Alguns caminhos práticos, do mais barato ao mais trabalhoso:<\/p>\n        <div style=\"display:grid;grid-template-columns:auto 1fr;gap:0 22px;margin:24px 0\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">01<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Ligue para a administradora do condomínio<\/div><div style=\"font-size:15px;color:#575147\">O caminho mais direto e o mais subestimado. Síndico e administradora costumam saber se a unidade está vazia e quanto há de débito — as duas informações que mais pesam na decisão.<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">02<\/div>\n          <div style=\"padding:0 0 22px;border-bottom:1px solid #C9BFAF;margin-bottom:22px\"><div style=\"font-weight:400;color:#141210\">Observe quantas unidades do mesmo endereço estão à venda<\/div><div style=\"font-size:15px;color:#575147\">Vários imóveis do mesmo prédio em leilão ao mesmo tempo costuma indicar um empreendimento entregue há pouco, em que muitos compradores perderam a unidade ainda na planta. Nesses casos há boa chance de o imóvel <strong style=\"font-weight:500\">nunca ter sido habitado<\/strong>.<\/div><\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">03<\/div>\n          <div><div style=\"font-weight:400;color:#141210\">Peça uma visita paga a alguém na região<\/div><div style=\"font-size:15px;color:#575147\">Um entregador ou motoboy contratado para ir ao endereço custa poucas dezenas de reais e resolve a dúvida com foto. É o que viabiliza analisar imóvel em outro estado.<\/div><\/div>\n        <\/div>\n        <div style=\"border-left:3px solid #4F5741;background:#E5E8DB;padding:20px 26px;margin:28px 0\">\n          <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#5C6350;margin-bottom:8px\">Ordens de grandeza para provisionar<\/div>\n          <div style=\"color:#241F19\">Quando a via judicial é necessária, a ação de imissão na posse costuma ser orçada na casa dos <strong style=\"font-weight:500\">R$ 4.500<\/strong>, com prazo que em geral se conta em meses. Já um acordo com auxílio-mudança de um ou dois aluguéis costuma sair mais barato — e mais rápido — do que a obra de um imóvel entregue vazio e sem acabamento.<br><br>Uma expectativa realista sobre a conversa: <strong style=\"font-weight:500\">a primeira resposta do ocupante costuma ser não<\/strong>. Isso não significa que o caso vá para a Justiça; significa apenas que a negociação começou.<\/div>\n        <\/div>\n        <p style=\"margin:0;color:#1E1B17\">E o outro lado da moeda do imóvel desocupado: ele frequentemente vem <strong style=\"font-weight:500\">sem piso nos quartos e na sala e sem box no banheiro<\/strong>, porque nunca chegou a ser habitado. Provisione o acabamento — na faixa popular, algo como R$ 100 por metro quadrado de piso mais a pintura — e lembre que esse acabamento costuma se pagar com folga no preço de venda.<\/p>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 20px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">03<\/span>Judicial × extrajudicial são operações diferentes<\/h2>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#C9BFAF;border:1px solid #C9BFAF\">\n          <div style=\"background:#FFFDFA;padding:26px\">\n            <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:10px\">Judicial<\/div>\n            <p style=\"margin:0;font-size:15px;line-height:1.65;color:#241F19\">Exige mais leitura processual: validade das intimações, penhoras e credores concorrentes, recursos, preço vil, parcelamento, expedição da carta e imissão. Oportunidades maiores, mas demanda capacidade jurídica superior.<\/p>\n          <\/div>\n          <div style=\"background:#FFFDFA;padding:26px\">\n            <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:10px\">Extrajudicial (ex.: Caixa)<\/div>\n            <p style=\"margin:0;font-size:15px;line-height:1.65;color:#241F19\">Mais padronizado: regras concentradas no edital, procedimento organizado, às vezes financiável. Por isso é a porta de entrada recomendada — desde que o 1º imóvel seja residencial, de valor moderado, em região conhecida, líquido e documentalmente simples.<\/p>\n          <\/div>\n        <\/div>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">04<\/span>Alienação fiduciária<\/h2>\n        <p style=\"margin:0;color:#1E1B17\">No extrajudicial, após o inadimplemento e a intimação de 15 dias para purgação, a propriedade se consolida no credor, que promove o leilão (Lei 9.514/97 + Lei 14.711/2023). Pontos-chave:<\/p>\n        <ul style=\"list-style:none;padding:0;margin:18px 0\">\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span>Primeiro leilão pelo valor de avaliação; segundo leilão (15 dias depois) pode aceitar lance ≥ 50% da avaliação.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span>O devedor (fiduciante) mantém <strong style=\"font-weight:500\">direito de preferência<\/strong> para recomprar até o segundo leilão.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span>Se não houver interessados, a dívida pode ser extinta e o imóvel fica com o credor.<\/span><\/li>\n          <li style=\"padding:12px 0;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span>Eventual excedente do lance sobre a dívida é devolvido ao devedor.<\/span><\/li>\n        <\/ul>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">05<\/span>Tema 1.134 do STJ — tributos e o arrematante<\/h2>\n        <div style=\"border-left:3px solid #4F5741;background:#E5E8DB;padding:20px 26px;margin:20px 0\">\n          <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#5C6350;margin-bottom:8px\">O que ficou decidido (acórdão publicado em out/2024)<\/div>\n          <div style=\"color:#241F19\">É <strong style=\"font-weight:500\">inválida<\/strong> a cláusula de edital que joga sobre o arrematante os débitos <strong style=\"font-weight:500\">tributários<\/strong> (ex.: IPTU) anteriores à arrematação — mesmo que o edital diga o contrário (CTN art. 130, § único). Esses tributos são pagos com o valor arrecadado no leilão (sub-rogação no preço).<br><br><strong style=\"font-weight:500\">Atenção à distinção:<\/strong> a tese vale só para tributos. Débitos de condomínio continuam podendo recair sobre o arrematante quando previstos no edital.<\/div>\n        <\/div>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">06<\/span>O imposto sobre o lucro, e uma armadilha de repetição<\/h2>\n        <p style=\"margin:0 0 14px;color:#1E1B17\">Vendido o imóvel, o lucro é ganho de capital e o imposto começa em <strong style=\"font-weight:500\">15%<\/strong> sobre a diferença entre o valor de venda e o custo de aquisição — no qual entram o preço pago, o ITBI, o registro e as benfeitorias comprovadas por nota fiscal. Guardar essas notas é, na prática, dinheiro: elas reduzem a base de cálculo.<\/p>\n        <p style=\"margin:0 0 14px;color:#1E1B17\">Existem isenções, e elas são frequentemente apresentadas de forma incompleta. Vale conhecer as condições reais:<\/p>\n        <ul style=\"list-style:none;padding:0;margin:18px 0\">\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Reinvestimento em 180 dias.<\/strong> Quem aplica o produto da venda na compra de outro imóvel <em>residencial<\/em> no país fica isento. Só que o benefício vale <strong style=\"font-weight:500\">uma vez a cada cinco anos<\/strong>, é <strong style=\"font-weight:500\">proporcional<\/strong> à parcela reinvestida e não alcança terreno nem construção. Ou seja: serve a quem está trocando de imóvel — não a quem vende para transformar em caixa.<\/span><\/li>\n          <li style=\"padding:12px 0;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Único imóvel até R$ 440 mil<\/strong>, desde que não tenha havido outra venda nos cinco anos anteriores.<\/span><\/li>\n        <\/ul>\n        <div style=\"border-left:3px solid #9C4B3B;background:#F4E4DE;padding:20px 26px;margin:28px 0\">\n          <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#9C4B3B;margin-bottom:8px\">A armadilha de quem começa a repetir<\/div>\n          <div style=\"color:#241F19\">Quem compra e vende imóveis <strong style=\"font-weight:500\">de forma habitual e com intuito de lucro<\/strong> deixa de ser tratado como investidor eventual: passa a ser <strong style=\"font-weight:500\">equiparado a pessoa jurídica<\/strong> para fins tributários, apurando por lucro presumido ou real em vez da regra simples de ganho de capital. A norma da Receita menciona expressamente a <strong style=\"font-weight:500\">arrematação em leilão<\/strong> entre os atos que contam para essa avaliação.<br><br>Não existe um número mágico de operações que dispare a regra — o critério é a habitualidade e a intenção de continuidade, analisadas caso a caso. Por isso a recomendação prática é simples: <strong style=\"font-weight:500\">converse com um contador antes da terceira operação do ano<\/strong>, e decida pessoa física ou jurídica com números na mão. É uma conversa barata perto do custo de descobrir depois.<\/div>\n        <\/div>\n        <p style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:#575147;margin:6px 0 0\">Nenhum material de estudo substitui um contador. Este item existe para que a pergunta seja feita no momento certo — antes, e não depois.<\/p>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 10px;color:#141210\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A79E92;margin-right:14px;vertical-align:middle\">07<\/span>Mapa de riscos, por prioridade<\/h2>\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;margin:16px 0;font-size:14.5px\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align:left;padding:10px 14px 10px 0;border-bottom:1px solid #141210;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#141210\">Risco<\/sc-raw-th>\n            <sc-raw-th style=\"text-align:left;padding:10px 14px;border-bottom:1px solid #141210;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#141210\">Gravidade<\/sc-raw-th>\n            <sc-raw-th style=\"text-align:left;padding:10px 0 10px 14px;border-bottom:1px solid #141210;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#141210\">Mitigação<\/sc-raw-th>\n          <\/sc-raw-tr><\/sc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding:13px 14px 13px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#141210\">Ônus ocultos (hipoteca, penhora, condomínio)<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#9C4B3B\">Crítico<\/sc-raw-td><sc-raw-td style=\"padding:13px 0 13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Diligência completa em matrícula e certidões.<\/sc-raw-td><\/sc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:13px 14px 13px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#141210\">Ocupação por terceiros<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#9C4B3B\">Alto<\/sc-raw-td><sc-raw-td style=\"padding:13px 0 13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Investigar posse; provisionar custo e prazo de desocupação.<\/sc-raw-td><\/sc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:13px 14px 13px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#141210\">Vícios do edital<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#7B3B1E\">Médio-alto<\/sc-raw-td><sc-raw-td style=\"padding:13px 0 13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Ler o edital contra a lei; parecer jurídico em caso de dúvida.<\/sc-raw-td><\/sc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:13px 14px 13px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#141210\">Preço vil<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#7B3B1E\">Médio<\/sc-raw-td><sc-raw-td style=\"padding:13px 0 13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Não ofertar abaixo de 50% da avaliação sem respaldo.<\/sc-raw-td><\/sc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:13px 14px 13px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#141210\">Perda de caução por inadimplência<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#7B3B1E\">Médio<\/sc-raw-td><sc-raw-td style=\"padding:13px 0 13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Só dar lance com o dinheiro garantido.<\/sc-raw-td><\/sc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:13px 14px 13px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#141210\">Custos mal calculados (ITBI, emolumentos)<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#7B3B1E\">Médio<\/sc-raw-td><sc-raw-td style=\"padding:13px 0 13px 14px;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Consultar tabelas oficiais antes.<\/sc-raw-td><\/sc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:13px 14px 13px 0;vertical-align:top;color:#141210\">Contestação pós-leilão<\/sc-raw-td><sc-raw-td style=\"padding:13px 14px;vertical-align:top;color:#575147\">Baixo<\/sc-raw-td><sc-raw-td style=\"padding:13px 0 13px 14px;vertical-align:top;color:#3B362E\">Conhecer prazos do CPC 903 e a ação de invalidação.<\/sc-raw-td><\/sc-raw-tr>\n          <\/sc-raw-tbody>\n        <\/sc-raw-table>\n        <div style=\"border-left:3px solid #7B3B1E;background:#EFE1D6;padding:20px 26px;margin:28px 0\">\n          <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:8px\">O que os vídeos costumam exagerar<\/div>\n          <div style=\"color:#241F19\">Facilidade de financiamento com entrada mínima · rapidez da desocupação · margens de 40–100% apresentadas como usuais · operar sem conhecimento jurídico · segurança de comprar em outra cidade · rentabilidade calculada sem imposto e sem custo do tempo · retorno de uma operação curta anunciado sem anualizar · silêncio sobre a tributação de quem opera com habitualidade.<br><br>Um teste rápido e honesto para qualquer conta que lhe apresentarem: <strong style=\"font-weight:500\">peça o mesmo número depois do imposto, e depois refaça a conta supondo que o imóvel venda pelo menor preço plausível.<\/strong> Se o negócio continuar de pé nos dois casos, ele provavelmente é bom de verdade.<\/div>\n        <\/div>\n      <\/section>\n\n      <section style=\"{{ secChecklists }}\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;color:#6E7561\">PRÁTICA<\/div>\n        <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:300;font-size:50px;line-height:1.1;margin:14px 0 18px;color:#141210\">Checklists &amp; Modelos<\/h1>\n        <p style=\"font-size:18px;color:#3B362E;max-width:58ch;margin:0 0 40px\">Listas para usar em cada arremate. As marcações ficam salvas neste navegador enquanto você estuda.<\/p>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:36px 0 14px;color:#141210\">Checklist de documentação<\/h2>\n        <div sc-camel-on-click=\"{{ onDoc }}\" style=\"display:flex;flex-direction:column\">\n          <div data-i=\"0\" style=\"display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #C9BFAF;cursor:pointer\"><span style=\"{{ docBox0 }}\"><\/span><span style=\"{{ docTxt0 }}\">Edital do leilão lido e analisado em detalhe<\/span><\/div>\n          <div data-i=\"1\" style=\"display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #C9BFAF;cursor:pointer\"><span style=\"{{ docBox1 }}\"><\/span><span style=\"{{ docTxt1 }}\">Matrícula atualizada do imóvel<\/span><\/div>\n          <div data-i=\"2\" style=\"display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #C9BFAF;cursor:pointer\"><span style=\"{{ docBox2 }}\"><\/span><span style=\"{{ docTxt2 }}\">Certidões negativas do imóvel e do devedor (estadual, federal, trabalhista, protestos)<\/span><\/div>\n          <div data-i=\"3\" style=\"display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #C9BFAF;cursor:pointer\"><span style=\"{{ docBox3 }}\"><\/span><span style=\"{{ docTxt3 }}\">Certidão de ônus reais (cartório de imóveis)<\/span><\/div>\n          <div data-i=\"4\" style=\"display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #C9BFAF;cursor:pointer\"><span style=\"{{ docBox4 }}\"><\/span><span style=\"{{ docTxt4 }}\">Certidão de débitos: IPTU, condomínio, tributos<\/span><\/div>\n          <div data-i=\"5\" style=\"display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #C9BFAF;cursor:pointer\"><span style=\"{{ docBox5 }}\"><\/span><span style=\"{{ docTxt5 }}\">Documentos pessoais (CPF, RG, comprovante)<\/span><\/div>\n          <div data-i=\"6\" style=\"display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #C9BFAF;cursor:pointer\"><span style=\"{{ docBox6 }}\"><\/span><span style=\"{{ docTxt6 }}\">Procuração específica para leilão (se não comparecer)<\/span><\/div>\n          <div data-i=\"7\" style=\"display:flex;gap:16px;align-items:flex-start;padding:14px 0;cursor:pointer\"><span style=\"{{ docBox7 }}\"><\/span><span style=\"{{ docTxt7 }}\">Planilha financeira completa (lance + impostos + taxas)<\/span><\/div>\n        <\/div>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 14px;color:#141210\">Checklist de riscos<\/h2>\n        <div sc-camel-on-click=\"{{ onRisk }}\" style=\"display:flex;flex-direction:column\">\n          <div data-i=\"0\" style=\"display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #C9BFAF;cursor:pointer\"><span style=\"{{ riskBox0 }}\"><\/span><span style=\"{{ riskTxt0 }}\">Pesquisa de ônus pendentes (certidões)<\/span><\/div>\n          <div data-i=\"1\" style=\"display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #C9BFAF;cursor:pointer\"><span style=\"{{ riskBox1 }}\"><\/span><span style=\"{{ riskTxt1 }}\">Verificação de ocupação / necessidade de desocupação<\/span><\/div>\n          <div data-i=\"2\" style=\"display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #C9BFAF;cursor:pointer\"><span style=\"{{ riskBox2 }}\"><\/span><span style=\"{{ riskTxt2 }}\">Conferência de valores mínimos e prazos no edital<\/span><\/div>\n          <div data-i=\"3\" style=\"display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #C9BFAF;cursor:pointer\"><span style=\"{{ riskBox3 }}\"><\/span><span style=\"{{ riskTxt3 }}\">Planejamento financeiro (caução e pagamento final)<\/span><\/div>\n          <div data-i=\"4\" style=\"display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #C9BFAF;cursor:pointer\"><span style=\"{{ riskBox4 }}\"><\/span><span style=\"{{ riskTxt4 }}\">Confir ital<\/div><p style=\"margin:0;font-size:15px;line-height:1.65;color:#3B362E\">Modelo de e-mail/carta para pedir o edital ao tribunal ou leiloeiro e concluir o cadastro em plataformas.<\/p><\/div>\n        <\/div>\n        <div style=\"border-left:3px solid #4F5741;background:#E5E8DB;padding:20px 26px;margin:28px 0 0\">\n          <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#5C6350;margin-bottom:8px\">Próximo passo<\/div>\n          <div style=\"color:#241F19\">Posso transformar esses modelos em <strong style=\"font-weight:500\">arquivos prontos para baixar<\/strong> (planilha .xlsx de custos e modelos .docx de procuração/petição). É só pedir.<\/div>\n        <\/div>\n      <\/section>\n\n      <section style=\"{{ secVideos }}\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;color:#6E7561\">MÍDIA<\/div>\n        <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:300;font-size:50px;line-height:1.1;margin:14px 0 18px;color:#141210\">Vídeos selecionados<\/h1>\n        <p style=\"font-size:18px;color:#3B362E;max-width:58ch;margin:0 0 40px\">Sete conteúdos publicados entre jul/2025 e jul/2026, ordenados por prioridade de estudo. Cada um traz a contribuição principal e a limitação a ter em mente.<\/p>\n\n        <div style=\"display:flex;flex-direction:column\">\n          <div style=\"display:grid;grid-template-columns:56px 1fr;gap:22px;padding:26px 0;border-top:1px solid #C9BFAF\">\n            <div style=\"font-family:'Cormorant Garamond',serif;font-size:34px;color:#C6BCAC;line-height:1\">01<\/div>\n            <div>\n              <a href=\"https://podimo.com/shows/os-socios-podcast/episode/3b8d691b-63a5-5cf5-81ed-e0ae31020fd7\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Cormorant Garamond',serif;font-size:24px;color:#141210;border-bottom:1px solid #D6CEC0\">Como ganhar dinheiro com imóveis de leilão?<\/a>\n              <div style=\"font-family:'IBM Plex mily:'Cormorant Garamond',serif;font-size:34px;color:#C6BCAC;line-height:1\">03<\/div>\n            <div>\n              <a href=\"https://music.amazon.com.br/podcasts/76cfae8d-3a6f-46cf-8290-e7bf59febb42/episodes/7225c7cf-7c27-44ae-9a56-49183905ac10/sublime-talks-podcast-ep-17-marco-legal-das-garantias-e-leil%C3%B5es-de-im%C3%B3veis-com-mauro-ant%C3%B4nio-rocha\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Cormorant Garamond',serif;font-size:24px;color:#141210;border-bottom:1px solid #D6CEC0\">Marco Legal das Garantias e leilões de imóveis<\/a>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:#9A9188;margin:10px 0 12px;text-transform:uppercase\">Sublime Talks EP. 17 · Mauro Antônio Rocha · 03.10.2025<\/div>\n              <div style=\"font-size:15px;color:#241F19;margin-bottom:6px\">Melhor fonte sobre alienação fiduciária e as mudanças da Lei 14.711/2023.<\/div>\n              <div style=\"font-size:15px;color:#9C4B3B\">Técnico; menos orientado à operação cotidiana do investidor.<\/div>\n            <\/div>\n          <\/div>\n          <div style=\"display:grid;grid-template-columns:56px 1fr;gap:22px;padding:26px 0;border-top:1px solid #C9BFAF\">\n            <div style=\"font-family:'Cormorant Garamond',serif;font-size:34px;color:#C6BCAC;line-height:1\">04<\/div>\n            <div>\n              <a href=\"https://open.spotify.com/episode/6pjUSlJqipG8GPNxvOlyyV\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Cormorant Garamond',serif;font-size:24px;color:#141210;border-bottom:1px solid #D6CEC0\">Como construir uma carteira de imóveis com pouco dinheiro<\/a>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:#9A9188;margin:10px 0 12px;text-transform:uppercase\">PrimoCast 471 · Lerry Granville e Gaspar Motta · 20.10.2025<\/div>\n              <div style=\"font-size:15px;color:#241F19;margin-bottom:6px\">Explica alavancagem, financiamento, consórcio, juros e momento de venda.<\/div>\n              <div style=\"font-size:15px;color:#9C4B3B\">Mistura leilões com outros modelos; enfatiza expansão mais do que controle de risco.<\/div>\n            <\/div>\n          <\/div>\n          <div style=\"display:grid;grid-template-columns:56px 1fr;gap:22px;padding:26px 0;border-top:1px solid #C9BFAF\">\n            <div style=\"font-family:'Cormorant Garamond',serif;font-size:34px;color:#C6BCAC;line-height:1\">05<\/div>\n            <div>\n              <a href=\"https://open.spotify.com/show/1BdAVFJlpXs6UJOSD7iOMZ\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Cormorant Garamond',serif;font-size:24px;color:#141210;border-bottom:1px solid #D6CEC0\">Imóvel de leilão é furada ou dá dinheiro?<\/a>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:#9A9188;margin:10px 0 12px;text-transform:uppercase\">Gêmeos Podcast 148 · Victor Oliveira · 09.07.2026<\/div>\n              <div style=\"font-size:15px;color:#241F19;margin-bottom:6px\">Discussão atual sobre viabilidade econômica e profissionalização da atividade.<\/div>\n              <div style=\"font-size:15px;color:#9C4B3B\">Introdutório e comercial; exige confirmação externa das alegações de rentabilidade.<\/div>\n            <\/div>\n          <\/div>\n          <div style=\"display:grid;grid-template-columns:56px 1fr;gap:22px;padding:26px 0;border-top:1px solid #C9BFAF\">\n            <div style=\"font-family:'Cormorant Garamond',serif;font-size:34px;color:#C6BCAC;line-height:1\">06<\/div>\n            <div>\n              <a href=\"https://podcasts.apple.com/br/podcast/alfa-leil%C3%B5es-cast/id1875035372\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Cormorant Garamond',serif;font-size:24px;color:#141210;border-bottom:1px solid #D6CEC0\">Desocupações nos leilões judiciais e extrajudiciais<\/a>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:#9A9188;margin:10px 0 12px;text-transform:uppercase\">Alfa Leilões · 12.09.2025<\/div>\n              <div style=\"font-size:15px;color:#241F19;margin-bottom:6px\">Mostra como a estratégia de obter a posse muda conforme a origem (judicial ou extrajudicial).<\/div>\n              <div style=\"font-size:15px;color:#9C4B3B\">Produzido por uma leiloaria; útil tecnicamente, mas não é fonte independente.<\/div>\n            <\/div>\n          <\/div>\n          <div style=\"display:grid;grid-template-columns:56px 1fr;gap:22px;padding:26px 0;border-top:1px solid #C9BFAF;border-bottom:1px solid #C9BFAF\">\n            <div style=\"font-family:'Cormorant Garamond',serif;font-size:34px;color:#C6BCAC;line-height:1\">07<\/div>\n            <div>\n              <a href=\"https://zeno.fm/podcast/smartcast-jkfaey/episodes/leilao-de-imoveis-3-arremates-em-21-dias/\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Cormorant Garamond',serif;font-size:24px;color:#141210;border-bottom:1px solid #D6CEC0\">Leilão de imóveis: 3 arremates em 21 dias<\/a>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:#9A9188;margin:10px 0 12px;text-transform:uppercase\">SmartCast · 24.06.2026<\/div>\n              <div style=\"font-size:15px;color:#241F19;margin-bottom:6px\">Caso prático no entorno de Brasília: diligência presencial, financiamento da Caixa e estimativa de lucro.<\/div>\n              <div style=\"font-size:15px;color:#9C4B3B\">Estudo de caso de aluno; resultados estimados, não auditados.<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 14px;color:#141210\">Ordem recomendada para assistir<\/h2>\n        <ul style=\"list-style:none;padding:0;margin:0\">\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:16px;color:#1E1B17\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">01<\/span><span>Casal Notarial EP. 79 — construir a base de risco.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:16px;color:#1E1B17\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">02<\/span><span>Sublime Talks EP. 17 — entender alienação fiduciária e a legislação atual.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:16px;color:#1E1B17\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">03<\/span><span>Os Sócios 291 — visão completa da operação.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:16px;color:#1E1B17\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">04<\/span><span>PrimoCast 471 — crédito e alavancagem.<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:16px;color:#1E1B17\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">05<\/span><span>Alfa Leilões (desocupações) — diferenciar posse judicial e extrajudicial.<\/span><\/li>\n          <li style=\"padding:12px 0;display:flex;gap:16px;color:#1E1B17\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7B3B1E;padding-top:5px\">06<\/span><span>SmartCast e Gêmeos Podcast — casos reais, mantendo ceticismo quanto aos retornos.<\/span><\/li>\n        <\/ul>\n      <\/section>\n\n      <section style=\"{{ secLegislacao }}\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;color:#6E7561\">CONSULTA<\/div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#8A8177;border:1px solid #DFD8CC;padding:3px 8px\">REVISAR PERIODICAMENTE<\/div>\n        <\/div>\n        <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:300;font-size:50px;line-height:1.1;margin:14px 0 18px;color:#141210\">Referência jurídica<\/h1>\n        <p style=\"font-size:18px;color:#3B362E;max-width:58ch;margin:0 0 30px\">Base legal que sustenta todo o material. Confirme sempre a versão vigente — a legislação muda.<\/p>\n\n        <div style=\"border-left:3px solid #7B3B1E;background:#EFE1D6;padding:20px 26px;margin:0 0 40px\">\n          <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7B3B1E;margin-bottom:8px\">Isenção de responsabilidade<\/div>\n          <div style=\"color:#241F19\">Esta seção resume normas para fins de estudo. Não é parecer jurídico. Antes de decisões concretas, confirme o texto atualizado das leis e consulte um advogado especialista.<\/div>\n        <\/div>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:0 0 8px;color:#141210\">Legislação principal<\/h2>\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;margin:16px 0;font-size:14.5px\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align:left;padding:10px 20px 10px 0;border-bottom:1px solid #141210;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#141210;width:36%\">Norma<\/sc-raw-th>\n            <sc-raw-th style=\"text-align:left;padding:10px 0;border-bottom:1px solid #141210;font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#141210\">Do que trata<\/sc-raw-th>\n          <\/sc-raw-tr><\/sc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding:14px 20px 14px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#141210\">CPC/2015 — arts. 879 a 903 (Lei 13.105/2015)<\/sc-raw-td><sc-raw-td style=\"padding:14px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Procedimento do leilão judicial: publicação do edital, lances, preço vil, caução, carta de arrematação, imissão na posse.<\/sc-raw-td><\/sc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:14px 20px 14px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#141210\">Lei 9.514/1997<\/sc-raw-td><sc-raw-td style=\"padding:14px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Alienação fiduciária de imóveis e leilão extrajudicial. Alterada pelas Leis 13.465/2017 e 14.711/2023.<\/sc-raw-td><\/sc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:14px 20px 14px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#141210\">Lei 14.711/2023 (Marco Legal das Garantias)<\/sc-raw-td><sc-raw-td style=\"padding:14px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Atualiza o rito do leilão extrajudicial (prazos, dois leilões, lance mínimo).<\/sc-raw-td><\/sc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:14px 20px 14px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#141210\">Resolução CNJ 236/2016<\/sc-raw-td><sc-raw-td style=\"padding:14px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Uniformiza o leilão judicial eletrônico; leiloeiro credenciado e comissão mínima de 5%.<\/sc-raw-td><\/sc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:14px 20px 14px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#141210\">Lei 14.133/2021<\/sc-raw-td><sc-raw-td style=\"padding:14px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Leilão como modalidade de licitação para alienação de bens públicos.<\/sc-raw-td><\/sc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:14px 20px 14px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#141210\">Decreto 21.981/1932<\/sc-raw-td><sc-raw-td style=\"padding:14px 0;border-bottom:1px solid #C9BFAF;vertical-align:top;color:#3B362E\">Regulamenta a profissão de leiloeiro.<\/sc-raw-td><\/sc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:14px 20px 14px 0;vertical-align:top;color:#141210\">CTN — art. 130, § único<\/sc-raw-td><sc-raw-td style=\"padding:14px 0;vertical-align:top;color:#3B362E\">Sub-rogação dos tributos no preço da arrematação (base do Tema 1.134/STJ).<\/sc-raw-td><\/sc-raw-tr>\n          <\/sc-raw-tbody>\n        <\/sc-raw-table>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 8px;color:#141210\">Artigos do CPC que mais aparecem<\/h2>\n        <ul style=\"list-style:none;padding:0;margin:18px 0\">\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Art. 886–887<\/strong> — edital e sua publicação (prazo mínimo).<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Art. 891<\/strong> — preço vil: lance não pode ser inferior ao mínimo do edital (referência de 50% da avaliação).<\/span><\/li>\n          <li style=\"padding:12px 0;border-bottom:1px solid #C9BFAF;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Art. 892<\/strong> — consequências de não pagar (perda da caução).<\/span><\/li>\n          <li style=\"padding:12px 0;display:flex;gap:14px;color:#1E1B17\"><span style=\"color:#7B3B1E\">—<\/span><span><strong style=\"font-weight:500\">Art. 901–903<\/strong> — auto de arrematação, carta de arrematação, prazos de impugnação e desistência.<\/span><\/li>\n        <\/ul>\n\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;margin:48px 0 8px;color:#141210\">Jurisprudência-chave<\/h2>\n        <div style=\"border-left:3px solid #4F5741;background:#E5E8DB;padding:20px 26px;margin:18px 0 0\">\n          <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#5C6350;margin-bottom:8px\">STJ — Tema 1.134 (Repetitivo)<\/div>\n          <div style=\"color:#241F19\">Débitos <strong style=\"font-weight:500\">tributários<\/strong> anteriores à arrematação (ex.: IPTU) <strong style=\"font-weight:500\">não<\/strong> passam ao arrematante, ainda que o edital preveja — são pagos com o produto do leilão. A tese <strong style=\"font-weight:500\">não<\/strong> alcança débitos de condomínio, que podem recair sobre o arrematante se previstos no edital. Acórdão publicado em out/2024.<\/div>\n        <\/div>\n        <p style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:#575147;margin:22px 0 0\">Sugestão de manutenção: revisar esta seção a cada 6 meses ou quando houver nova tese do STJ sobre leilões.<\/p>\n      <\/section>\n\n    <\/div>\n  <\/main>\n<\/div>\n\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;basico&quot;,&quot;inter&quot;,&quot;avancado&quot;,&quot;checklists&quot;,&quot;videos&quot;,&quot;legislacao&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Comportamento&quot;},&quot;showImagePlaceholders&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Aparência&quot;},&quot;lastReview&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;jul/2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Conteúdo&quot;}}\">\nclass Component extends DCLogic {\n  constructor(p){\n    super(p);\n    this.state = { tab: p.startTab || 'inicio', doc: {}, risk: {} };\n  }\n  componentDidMount(){\n    try {\n      this.setState({\n        doc: JSON.parse(localStorage.getItem('fws_doc') || '{}'),\n        risk: JSON.parse(localStorage.getItem('fws_risk') || '{}')\n      });\n    } catch(e){}\n  }\n  go(tab){\n    this.setState({ tab });\n    window.scrollTo({ top: 0, behavior: 'smooth' });\n  }\n  toggle(kind, i){\n    const next = Object.assign({}, this.state[kind]);\n    next[i] = !next[i];\n    this.setState({ [kind]: next });\n    try { localStorage.setItem(kind === 'doc' ? 'fws_doc' : 'fws_risk', JSON.stringify(next)); } catch(e){}\n  }\n  handler(kind){\n    return (e) => {\n      const row = e.target.closest('[data-i]');\n      if (row) this.toggle(kind, row.getAttribute('data-i'));\n    };\n  }\n  navStyle(tab){\n    const on = this.state.tab === tab;\n    return {\n      display:'flex', alignItems:'center', gap:'2px', width:'100%', textAlign:'left',\n      background: on ? '#7B3B1E' : 'transparent', border:0, cursor:'pointer',\n      font:'inherit', fontSize:'14.5px', fontWeight: on ? 400 : 300,\n      color: on ? '#FFF8F1' : '#B0A594', padding:'9px 16px', letterSpacing:'.01em',\n      transition:'background .15s, color .15s'\n    };\n  }\n  renderVals(){\n    const show = t => ({ display: this.state.tab === t ? 'block' : 'none', animation:'fadeUp .35s ease' });\n    const v = {\n      lastReview: this.props.lastReview || 'jul/2026',\n      imgBlock: { display: (this.props.showImagePlaceholders ?? true) ? 'block' : 'none', margin:'0' },\n      secInicio: show('inicio'), secBasico: show('basico'), secInter: show('inter'),\n      secAvancado: show('avancado'), secChecklists: show('checklists'),\n      secVideos: show('videos'), secLegislacao: show('legislacao'),\n      navInicio: this.navStyle('inicio'), navBasico: this.navStyle('basico'),\n      navInter: this.navStyle('inter'), navAvancado: this.navStyle('avancado'),\n      navChecklists: this.navStyle('checklists'), navVideos: this.navStyle('videos'),\n      navLegislacao: this.navStyle('legislacao'),\n      goInicio: () => this.go('inicio'), goBasico: () => this.go('basico'),\n      goInter: () => this.go('inter'), goAvancado: () => this.go('avancado'),\n      goChecklists: () => this.go('checklists'), goVideos: () => this.go('videos'),\n      goLegislacao: () => this.go('legislacao'),\n      onDoc: this.handler('doc'), onRisk: this.handler('risk')\n    };\n    const mk = (kind, n) => {\n      for (let i = 0; i < n; i++){\n        const on = !!this.state[kind][i];\n        v[kind + 'Box' + i] = {\n          flex:'0 0 auto', width:'15px', height:'15px', marginTop:'6px',\n          border:'1px solid ' + (on ? '#8C5E44' : '#C6BCAC'),\n          background: on ? '#8C5E44' : 'transparent', display:'block'\n        };\n        v[kind + 'Txt' + i] = {\n          color: on ? '#9A9188' : '#3A352E',\n          textDecoration: on ? 'line-through' : 'none'\n        };\n      }\n    };\n    mk('doc', 8); mk('risk', 6);\n    return v;\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"
